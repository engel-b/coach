<!doctype html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Health Coach startet</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            display: grid;
            place-items: center;

            font-family: system-ui, sans-serif;

            background:
                radial-gradient(
                    circle at center,
                    #263746 0%,
                    #101820 70%
                );

            color: white;
        }

        .startup {
            text-align: center;
        }

        .startup h1 {
            margin: 0 0 1rem;
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 600;
        }

        .startup p {
            margin: 0;
            font-size: clamp(1rem, 2vw, 1.5rem);
            opacity: 0.75;
        }

        .indicator {
            width: 3rem;
            height: 3rem;

            margin: 2rem auto 0;

            border: 0.3rem solid rgb(255 255 255 / 20%);
            border-top-color: white;
            border-radius: 50%;

            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <main class="startup">
        <h1>Health Coach</h1>
        <p>Die Anwendung wird gestartet …</p>

        <div
            class="indicator"
            aria-hidden="true"
        ></div>
    </main>

    <script>
        const POLL_INTERVAL_MS = 1000

        async function waitForBackend() {
            try {
                const response = await fetch(
                    "/health",
                    {
                        cache: "no-store",
                    },
                )

                if (response.ok) {
                    /*
                     * replace() statt href:
                     *
                     * Die Startseite landet dadurch nicht in der
                     * Browser-History. Im Kiosk kann man also nicht
                     * versehentlich wieder auf die Startseite
                     * zurücknavigieren.
                     */
                    window.location.replace("/")
                    return
                }
            } catch {
                /*
                 * Während FastAPI startet, ist ein Verbindungsfehler
                 * ein erwarteter Zustand.
                 */
            }

            window.setTimeout(
                waitForBackend,
                POLL_INTERVAL_MS,
            )
        }

        void waitForBackend()
    </script>
</body>
</html>
